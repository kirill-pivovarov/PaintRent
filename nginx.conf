worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       C:/nginx-1.30.6/conf/mime.types;    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Разрешаем загрузку файлов картинок до 20 МБ (чтобы не было 413 ошибки)
    client_max_body_size 20M;

    # 1. Пул сервиса авторизации
    upstream auth_backend {
        server 127.0.0.1:8001;
    }

    # 2. Пул основного шлюза (картины, корзина, заказы, профили)
    upstream gateway_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen       80;
        server_name  localhost;

        # ----------------------------------------------------
        # 1. СТАТИКА (Nginx отдает сам напрямую с диска)
        # ----------------------------------------------------
        location /static/ {
            # ВНИМАНИЕ: укажите абсолютный путь к папке static со слэшем на конце!
            # Для Windows пути пишутся с прямыми слэшами:
            alias C:/Users/kiril/Documents/Study/4course/TehSP/PaintRent/static/;
            
            # Если запускаете через Docker, то путь внутри контейнера:
            # alias /var/www/static/;

            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ----------------------------------------------------
        # 2. МАРШРУТИЗАЦИЯ В AUTH SERVICE (/api/v1/auth)
        # ----------------------------------------------------
        location /api/v1/auth {
            proxy_pass http://auth_backend;
            
            # Проброс оригинальных заголовков клиента
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 3. ВСЕ ОСТАЛЬНЫЕ API-ЗАПРОСЫ В GATEWAY SERVICE
        # ----------------------------------------------------
        location /api/v1 {
            proxy_pass http://gateway_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 4. SWAGGER И ДОКУМЕНТАЦИЯ GATEWAY
        # ----------------------------------------------------
        location /docs {
            proxy_pass http://gateway_backend/docs;
        }
        location /openapi.json {
            proxy_pass http://gateway_backend/openapi.json;
        }
    }
}